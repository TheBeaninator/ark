name: validate manifest
on:
  pull_request:
  push: {branches: [main]}
  schedule: [{cron: "17 4 * * 1"}]   # weekly full sweep: catches repos that moved or vanished (prima.cpp did)
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: changed rows (pull request)
        if: github.event_name == 'pull_request'
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: python3 verify/validate-manifest.py --online --changed "origin/${{ github.base_ref }}"
      - name: full sweep (push / weekly)
        if: github.event_name != 'pull_request'
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: python3 verify/validate-manifest.py --online
